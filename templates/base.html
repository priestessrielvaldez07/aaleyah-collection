<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Aaleyah Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* =========================================
           THE AALEYAH COLLECTION BOUTIQUE THEME
           ========================================= */
        
        /* Default Light Mode (Cream Boutique) */
        :root, [data-bs-theme="light"] {
            --aal-bg: #FDFBF7;         /* Warm Cream Background */
            --aal-card: #FFFFFF;       /* Pure White Cards */
            --aal-border: #EAE5DC;     /* Soft Beige Borders */
            --aal-text: #3E3A36;       /* Dark Espresso Text */
            --aal-muted: #7A7269;      /* Muted Brown */
            --aal-nav: #2C2825;        /* Dark Espresso Navbar */
            --aal-accent: #C5A059;     /* Elegant Gold */
        }

        /* Dark Mode (Midnight Boutique) */
        [data-bs-theme="dark"] {
            --aal-bg: #181614;         /* Deep Dark Brown/Black */
            --aal-card: #26221F;       /* Dark Card Surface */
            --aal-border: #3D3833;     /* Subtle Dark Border */
            --aal-text: #E8E3D9;       /* Cream Text */
            --aal-muted: #A39B90;      /* Muted Cream */
            --aal-nav: #110F0E;        /* Pitch Dark Navbar */
            --aal-accent: #D4AF37;     /* Bright Gold */
        }

        /* Global Typography & Backgrounds */
        body {
            background-color: var(--aal-bg);
            color: var(--aal-text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* Navbar Styling */
        .navbar-aal {
            background-color: var(--aal-nav) !important;
            border-bottom: 2px solid var(--aal-accent);
        }
        .navbar-aal .navbar-brand {
            color: var(--aal-accent) !important;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .navbar-aal .nav-link {
            color: #E8E3D9 !important;
            font-weight: 500;
            transition: color 0.2s;
        }
        .navbar-aal .nav-link:hover {
            color: var(--aal-accent) !important;
        }

        /* Cards & Tables */
        .card {
            background-color: var(--aal-card);
            border: 1px solid var(--aal-border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .table {
            color: var(--aal-text);
            border-color: var(--aal-border);
        }
        .table-dark {
            background-color: var(--aal-nav) !important;
            color: var(--aal-accent) !important;
            border-color: var(--aal-border);
        }
        .table-hover tbody tr:hover {
            background-color: rgba(197, 160, 89, 0.05);
        }

        /* Forms */
        .form-control, .form-select {
            background-color: var(--aal-card);
            border: 1px solid var(--aal-border);
            color: var(--aal-text);
        }
        .form-control:focus {
            background-color: var(--aal-card);
            border-color: var(--aal-accent);
            color: var(--aal-text);
            box-shadow: 0 0 0 0.2rem rgba(197, 160, 89, 0.25);
        }

        /* Elegant Button Overrides */
        .btn-primary {
            background-color: var(--aal-accent);
            border-color: var(--aal-accent);
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background-color: #B08D4B;
            border-color: #B08D4B;
        }
        .btn-outline-primary {
            color: var(--aal-accent);
            border-color: var(--aal-accent);
        }
        .btn-outline-primary:hover {
            background-color: var(--aal-accent);
            border-color: var(--aal-accent);
            color: #FFFFFF;
        }
        .btn-success {
            background-color: #4A7C59; /* Muted Forest Green */
            border-color: #4A7C59;
        }
        .btn-success:hover {
            background-color: #3D6649;
            border-color: #3D6649;
        }
        .btn-danger {
            background-color: #9C4A4A; /* Muted Rose/Red */
            border-color: #9C4A4A;
        }
        .btn-danger:hover {
            background-color: #823D3D;
            border-color: #823D3D;
        }

        /* Text Utilities */
        .text-muted {
            color: var(--aal-muted) !important;
        }
        .bg-light {
            background-color: var(--aal-bg) !important;
        }

        /* Flash Messages */
        .alert {
            border: none;
            border-left: 4px solid var(--aal-accent);
        }
        .alert-success { background-color: rgba(74, 124, 89, 0.15); color: #4A7C59; }
        .alert-danger { background-color: rgba(156, 74, 74, 0.15); color: #9C4A4A; }
        .alert-warning { background-color: rgba(197, 160, 89, 0.15); color: #B08D4B; }
    </style>
</head>
<body>

    <!-- Navigation Bar (Exact same layout you liked, just themed) -->
    <nav class="navbar navbar-aal mb-4 sticky-top shadow">
        <div class="container-fluid d-block px-3 py-2">
            <a class="navbar-brand d-block mb-2 fs-4" href="/">Aaleyah Collection</a>
            <div class="d-flex justify-content-between flex-wrap">
                <ul class="navbar-nav flex-row mb-0">
                    <li class="nav-item"><a class="nav-link px-2" href="/pos">POS</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="/inventory">Inventory</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="/history">History</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="/reports">Reports</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="/profile">Account</a></li>
                </ul>
                <ul class="navbar-nav flex-row mb-0 align-items-center">
                    <!-- NEW: Dark/Light Mode Toggle Button -->
                    <li class="nav-item me-2">
                        <button id="theme-toggle" class="btn btn-sm btn-outline-warning" style="border-radius: 50%; width: 35px; height: 35px; padding: 0; font-size: 1rem;">🌙</button>
                    </li>
                    <li class="nav-item"><a class="nav-link px-2" style="color: var(--aal-accent) !important;" href="/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5 pt-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Theme Toggle Logic (Saves your preference) -->
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const htmlEl = document.documentElement;

        // Load saved theme or default to 'light' (Cream)
        const currentTheme = localStorage.getItem('aal-theme') || 'light';
        htmlEl.setAttribute('data-bs-theme', currentTheme);
        updateToggleIcon(currentTheme);

        themeToggle.addEventListener('click', () => {
            const newTheme = htmlEl.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
            htmlEl.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('aal-theme', newTheme);
            updateToggleIcon(newTheme);
        });

        function updateToggleIcon(theme) {
            themeToggle.innerHTML = theme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
